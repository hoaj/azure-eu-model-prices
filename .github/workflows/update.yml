name: Update prices

# Refreshes index.html from the live Azure Retail Prices API.
#  • Daily on a schedule (so the site stays current with no action from you)
#  • On demand via the "Run workflow" button (Actions tab) — this is your one-press refresh
on:
  schedule:
    - cron: '17 5 * * *'      # every day at 05:17 UTC
  workflow_dispatch:           # manual "Run workflow" button
    inputs:
      fail_test:
        description: 'Force a failing run to test failure email notifications'
        type: boolean
        default: false

permissions:
  contents: write              # allow committing the regenerated file
  issues: write                # allow opening a failure-notification issue
  pull-requests: write         # allow the drift agent to open a registry PR

concurrency:                   # never run two refreshes at once
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Notification test (manual only)
        if: ${{ inputs.fail_test }}
        run: |
          echo "::error::Deliberate test failure — verifying that failure emails reach hoaj@outlook.dk."
          exit 1

      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Regenerate index.html
        run: python3 generate.py

      - name: Commit if changed
        run: |
          git config user.name  "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "chore: refresh Azure prices ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi

      # A new model on Data Zone Standard needs a hand-written MODELS entry (meter names,
      # regions, reasoning levels). The build stays green — prices for existing models must
      # keep refreshing — so drift is surfaced as an assigned issue instead.
      - name: Raise an issue if the model registry has drifted
        if: ${{ hashFiles('drift.txt') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="📋 Model registry is out of date"
          body=$(printf 'The Azure Data Zone Standard availability page lists models that %s does not match:\n\n%s\n\nUpdate the `MODELS` (and `REASONING`) registry in `generate.py`.\nMeter names: https://prices.azure.com/api/retail/prices\n\nRun: %s\n\ncc @hoaj' "generate.py" "$(cat drift.txt)" "$RUN_URL")
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            printf '%s' "$body" | gh issue create --title "$title" --assignee hoaj --body-file -
          fi

      # Drafts the registry entry the issue above asks for, as a PR. Gated on the same drift
      # signal, so it runs ~once a quarter — not on the daily no-op. `continue-on-error` keeps
      # the daily price refresh green if the agent fails: the issue is the durable notification,
      # this is the convenience layer on top of it.
      - name: Draft the registry entry as a PR
        if: ${{ hashFiles('drift.txt') != '' }}
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          base_branch: main
          branch_prefix: registry/
          claude_args: |
            --allowedTools Read,Edit,Bash,Glob,Grep,WebFetch
            --model claude-opus-5
          prompt: |
            `drift.txt` in the repo root names Azure OpenAI models that are deployable on
            Data Zone Standard in Sweden Central / West Europe but are missing from the
            `MODELS` registry in `generate.py`. Add them.

            Follow the conventions already in the file rather than inventing new ones — read
            the existing gpt-5.4 / gpt-5.5 / gpt-5.6 entries first. In particular:

            - `meterIn` / `meterOut` must be the EXACT Azure meter names. Find them with:
              curl -s "https://prices.azure.com/api/retail/prices?currencyCode=USD&\$filter=armRegionName%20eq%20'swedencentral'%20and%20productName%20eq%20'Azure%20OpenAI%20GPT5'"
              The meter must be a **Data Zone** meter: `DZ` or `Dz` or `Data Zone` in the name.
              Watch out — `Gl` (Global Standard) meters sit right next to the Data Zone ones
              and match every other filter. A `Gl` meter would put Global prices on a page
              that is entirely about Data Zone; check this explicitly.
              For the 5.x family also use the **short-context, standard** tier — the meters
              with `ShortCo` and `Std`, NOT `LongCo`, `Batch`, `PP` (priority processing), or
              `Cd`/`cchd` (cached). Add `"note": "short-context tier"`, as the others do.
            - `released` is the version date from the availability page, quoted in drift.txt.
            - `regions` must match what drift.txt says — do not assume both regions.
            - Add a `REASONING` entry too. Check
              https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/reasoning
              for the supported reasoning_effort levels. For `default`, use None unless a
              primary source states a default for THAT model specifically — the file's
              convention is that None means "not documented". Do not infer a default from a
              sibling model or from a summary; guessing here is worse than leaving it None.

            Then run `python3 generate.py`. It must exit 0 AND leave no `drift.txt` behind.
            If a meter name is wrong it aborts with "price meter missing or renamed"; if the
            entry is incomplete, drift.txt is rewritten. Fix and re-run until both hold.

            Open a PR against main. Do not push to main directly, and do not commit
            index.html — the daily job regenerates it. In the PR description, list anything
            you were uncertain about (especially the reasoning default) so it gets reviewed
            rather than rubber-stamped.

      - name: Notify on failure (assign an issue -> email)
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="⚠️ Automated data update failed"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failed again — run: $RUN_URL"
          else
            printf 'The scheduled update (Azure prices / Cognigy / τ²-bench) failed.\n\nRun: %s\n\ncc @hoaj' "$RUN_URL" \
              | gh issue create --title "$title" --assignee hoaj --body-file -
          fi
